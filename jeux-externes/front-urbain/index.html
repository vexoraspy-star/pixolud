<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Front Urbain</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      #game { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: none; }
      /* Ecran de chargement : visible tant que le moteur prepare la ville
         (textures, ombres, shaders). Retire par src/main.js. */
      #chargement {
        position: fixed; inset: 0; z-index: 50;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(circle at 50% 40%, #2a2419 0%, #0b0a08 70%);
        color: #eef4f7; text-align: center; padding: 24px;
        font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      }
      #chargement h1 { font-size: 44px; letter-spacing: .3em; font-weight: 700; padding-left: .3em; }
      #chargement p { font-size: 14px; letter-spacing: .12em; color: rgba(214,227,234,.7); }
      #chargement .barre { width: 260px; height: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
      #chargement .barre i { display: block; width: 2%; height: 100%; background: #ffb02a; transition: width .4s ease-out; }
      #chargement .petit { font-size: 12px; letter-spacing: .06em; color: rgba(196,210,219,.5); max-width: 420px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div id="chargement" role="status">
      <h1>FRONT URBAIN</h1>
      <div class="barre"><i id="chargement-barre"></i></div>
      <p id="chargement-etape">Préparation du terrain…</p>
      <p class="petit">Tout est fabriqué par ton ordinateur au lancement : sur un portable modeste, cela peut prendre une à trois minutes.</p>
    </div>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
