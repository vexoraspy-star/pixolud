<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b16"/>
      <stop offset="0.55" stop-color="#0c3552"/>
      <stop offset="0.78" stop-color="#e2733a"/>
      <stop offset="1" stop-color="#2a0f12"/>
    </linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1216"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="soleil" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ff8a3a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5a2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="boom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.3" stop-color="#ffb347"/>
      <stop offset="0.7" stop-color="#ff5a1f" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff3b1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trace" x1="0" x2="1">
      <stop offset="0" stop-color="#fff2b0" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="lueur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <pattern id="planches" width="30" height="16" patternUnits="userSpaceOnUse">
      <rect width="30" height="16" fill="#d8b77e"/>
      <rect y="14" width="30" height="2" fill="#9c7a4a"/>
    </pattern>
  </defs>

  <!-- Ciel au couchant -->
  <rect width="800" height="320" fill="url(#ciel)"/>
  <circle cx="560" cy="205" r="150" fill="url(#soleil)"/>
  <g fill="#ffffff" opacity="0.7">
    <circle cx="90" cy="40" r="1.2"/><circle cx="210" cy="22" r="1"/><circle cx="330" cy="55" r="1.3"/>
    <circle cx="470" cy="30" r="1"/><circle cx="690" cy="48" r="1.2"/><circle cx="760" cy="18" r="0.9"/>
  </g>

  <!-- Horizon : ruines et hangars -->
  <path d="M0 214 L60 214 L60 188 L120 188 L120 204 L170 204 L170 176 L230 176 L230 214 L330 214 L330 196 L360 196 L360 214 L800 214 L800 320 L0 320 Z" fill="#12090d"/>
  <path d="M640 214 L640 170 L700 150 L760 170 L760 214 Z" fill="#170b10"/>

  <!-- Explosion de roquette au loin -->
  <circle cx="650" cy="178" r="46" fill="url(#boom)"/>
  <g stroke="#ffcf7a" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M650 178 L620 150"/><path d="M650 178 L688 146"/><path d="M650 178 L700 186"/><path d="M650 178 L612 196"/>
  </g>

  <!-- Sol en perspective -->
  <path d="M0 214 H800 V320 H0 Z" fill="url(#sol)"/>
  <g stroke="#4de1ff" stroke-opacity="0.18" stroke-width="1.2">
    <path d="M400 214 L-200 320"/><path d="M400 214 L0 320"/><path d="M400 214 L200 320"/>
    <path d="M400 214 L400 320"/><path d="M400 214 L600 320"/><path d="M400 214 L800 320"/><path d="M400 214 L1000 320"/>
    <path d="M0 232 H800"/><path d="M0 256 H800"/><path d="M0 288 H800"/>
  </g>

  <!-- Murs de construction (planches, cadre bleu) -->
  <g>
    <rect x="470" y="170" width="54" height="66" fill="url(#planches)"/>
    <rect x="470" y="170" width="54" height="66" fill="none" stroke="#2f5d8c" stroke-width="5"/>
    <path d="M472 234 L522 172" stroke="#2f5d8c" stroke-width="4"/>
    <rect x="524" y="178" width="46" height="58" fill="url(#planches)" opacity="0.85"/>
    <rect x="524" y="178" width="46" height="58" fill="none" stroke="#2f5d8c" stroke-width="4"/>
    <path d="M526 234 L568 180" stroke="#2f5d8c" stroke-width="3.5"/>
  </g>

  <!-- Adversaire au loin -->
  <g fill="#06080b">
    <circle cx="600" cy="196" r="6"/>
    <rect x="593" y="202" width="14" height="22" rx="3"/>
    <rect x="594" y="224" width="5" height="14"/><rect x="601" y="224" width="5" height="14"/>
    <rect x="578" y="206" width="18" height="4"/>
  </g>

  <!-- Caisses au premier plan -->
  <g>
    <rect x="-10" y="220" width="120" height="100" fill="#3a2414"/>
    <rect x="-10" y="220" width="120" height="100" fill="none" stroke="#1d110a" stroke-width="6"/>
    <path d="M-10 320 L110 220" stroke="#1d110a" stroke-width="6"/>
    <rect x="690" y="236" width="120" height="90" fill="#2d1b10"/>
    <rect x="690" y="236" width="120" height="90" fill="none" stroke="#160c06" stroke-width="6"/>
    <path d="M690 236 L810 326" stroke="#160c06" stroke-width="6"/>
  </g>

  <!-- Tirs tracants -->
  <g filter="url(#lueur)" opacity="0.9">
    <rect x="352" y="160" width="230" height="4" fill="url(#trace)" transform="rotate(8 352 160)"/>
    <rect x="352" y="168" width="210" height="3" fill="url(#trace)" transform="rotate(12 352 168)"/>
  </g>
  <rect x="352" y="160" width="230" height="1.6" fill="#fff4c6" transform="rotate(8 352 160)"/>

  <!-- Le tireur, en contre-jour, epaule son fusil -->
  <g>
    <!-- jambes -->
    <path d="M232 320 L246 250 L270 250 L262 320 Z" fill="#070a0f"/>
    <path d="M268 320 L276 252 L298 250 L300 320 Z" fill="#060910"/>
    <!-- buste -->
    <path d="M226 256 L236 176 Q262 160 292 172 L304 256 Z" fill="#0a1017"/>
    <!-- gilet et liseré -->
    <path d="M240 188 L292 184 L298 244 L236 246 Z" fill="#101a24"/>
    <path d="M236 176 Q262 160 292 172" stroke="#35d6ff" stroke-width="2.5" fill="none" opacity="0.8"/>
    <!-- tete et casque -->
    <circle cx="276" cy="148" r="20" fill="#0a1017"/>
    <path d="M254 146 Q258 122 282 124 Q300 128 298 146 Z" fill="#141f2a"/>
    <rect x="280" y="144" width="22" height="7" rx="2" fill="#35d6ff"/>
    <path d="M258 140 Q262 126 280 126" stroke="#35d6ff" stroke-width="2" fill="none" opacity="0.7"/>
    <!-- bras -->
    <path d="M250 196 L318 172 L324 186 L258 214 Z" fill="#0c131b"/>
    <path d="M284 206 L336 176 L340 188 L292 218 Z" fill="#0a1017"/>
    <!-- fusil -->
    <g>
      <rect x="262" y="158" width="92" height="14" rx="3" fill="#1b232c" transform="rotate(-4 262 158)"/>
      <rect x="300" y="146" width="26" height="12" rx="2" fill="#11171d" transform="rotate(-4 300 146)"/>
      <circle cx="312" cy="151" r="3" fill="#ff3b30"/>
      <rect x="350" y="158" width="36" height="5" fill="#2a333d" transform="rotate(-4 350 158)"/>
      <rect x="312" y="170" width="10" height="26" rx="2" fill="#141b22" transform="rotate(12 312 170)"/>
      <rect x="240" y="162" width="28" height="18" rx="3" fill="#141b22" transform="rotate(-4 240 162)"/>
    </g>
    <!-- eclair de bouche -->
    <g transform="translate(388 158)">
      <circle r="16" fill="#ffd27a" opacity="0.45" filter="url(#lueur)"/>
      <path d="M0 -12 L4 -3 L16 0 L4 3 L0 12 L-3 3 L-12 0 L-3 -3 Z" fill="#fff1b8"/>
    </g>
  </g>

  <!-- Reticule de lunette sur la cible -->
  <g transform="translate(600 206)" fill="none" stroke="#7ff0ff" stroke-width="2" opacity="0.9">
    <circle r="34"/>
    <circle r="3" fill="#ff3b30" stroke="none"/>
    <path d="M-48 0 H-12 M12 0 H48 M0 -48 V-12 M0 12 V48"/>
  </g>

  <!-- Vignette -->
  <rect width="800" height="320" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="40"/>
</svg>
